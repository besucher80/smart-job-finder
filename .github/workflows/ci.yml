name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: phpunit:10.5, phpstan:1.12

      - name: Unit tests
        run: phpunit -c phpunit.xml.dist

      - name: PHPStan
        run: phpstan analyse -c phpstan.neon --memory-limit=512M
