<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{pagination.pages} > 1">
    <nav class="job-finder__pagination" aria-label="{f:translate(key: 'pagination.label')}">
        <f:if condition="{pagination.prev}">
            <f:link.action
                action="{pagination.action}"
                arguments="{q: filter.q, location: filter.location, employmentType: filter.employmentType, workplaceType: filter.workplaceType, page: pagination.prev}"
                class="job-finder__page-link"
            >
                <f:translate key="pagination.prev"/>
            </f:link.action>
        </f:if>
        <span class="job-finder__page-status">
            <f:translate key="pagination.status" arguments="{0: pagination.current, 1: pagination.pages}"/>
        </span>
        <f:if condition="{pagination.next}">
            <f:link.action
                action="{pagination.action}"
                arguments="{q: filter.q, location: filter.location, employmentType: filter.employmentType, workplaceType: filter.workplaceType, page: pagination.next}"
                class="job-finder__page-link"
            >
                <f:translate key="pagination.next"/>
            </f:link.action>
        </f:if>
    </nav>
</f:if>
</html>
